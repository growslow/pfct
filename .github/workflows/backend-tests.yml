name: Backend tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: Database migration and access checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      # Runs an isolated local stack on the runner. No cloud login or secrets.
      - name: Start temporary Supabase and apply migrations
        run: supabase start

      - name: Check database functions
        run: supabase db lint --local --level error --fail-on error

      - name: Test participant isolation and write permissions
        run: |
          docker exec -i supabase_db_pfct-nutrition \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/access.sql

      - name: Show database logs on failure
        if: failure()
        run: docker logs --tail 150 supabase_db_pfct-nutrition

      - name: Stop temporary Supabase
        if: always()
        run: supabase stop --no-backup
