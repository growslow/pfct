<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>登录 · PFCT</title><link rel="stylesheet" href="style.css"><script type="module" src="login.js"></script></head>
<body class="login-body"><main class="login-shell">
  <section class="login-story"><a class="brand" href="login.html">pfct<span>✳</span></a><span class="eyebrow">SMALL GUESSES, LASTING KNOWLEDGE.</span><h1>让每一餐，<br>成为一次<span class="accent">发现。</span></h1><p>用真实餐食练习营养直觉。<br>从自己的第一感觉出发，慢慢看懂食物。</p><div class="login-art" aria-hidden="true"><span>P</span><span>F</span><span>C</span><span>T</span></div><p class="small">PFCT · 营养认知学习实验</p></section>
  <section class="login-panel"><div class="role-switch" role="group" aria-label="登录入口"><button type="button" id="user-role" aria-pressed="true">用户登录</button><button type="button" id="admin-role" aria-pressed="false">管理员登录</button></div>
    <span class="eyebrow" id="login-eyebrow">YOUR NEXT DISCOVERY</span><h2 id="login-title">欢迎回来。</h2><p class="subtle" id="login-copy">登录后，继续认识自己的每一餐。</p>
    <form id="login-form"><label>邮箱<input id="login-email" type="email" autocomplete="username" required placeholder="you@example.com"></label><label>密码<input id="login-password" type="password" autocomplete="current-password" minlength="6" required placeholder="输入密码"></label>
      <details class="connection-details" id="connection-details"><summary>开发环境连接</summary><p class="small">填写 Supabase 公开配置。FatSecret ID / Secret 不在这里填写。</p><label>Supabase 项目地址<input id="login-url" type="url" autocomplete="off" placeholder="https://your-project.supabase.co"></label><label>Publishable / anon key<input id="login-key" type="password" autocomplete="off" placeholder="sb_publishable_…"></label></details>
      <button class="primary" id="login-submit" type="submit">登录，开始记录 ↗</button><button class="quiet" id="login-signup" type="button">还没有账户？注册</button>
    </form><p id="login-notice" class="notice" role="status" aria-live="polite">首次真实登录前，请展开并填写开发环境连接。</p>
    <div class="demo-entry"><span>只想先看看？</span><button class="quiet" type="button" id="demo-entry">体验用户演示 ↗</button><p class="small" id="demo-copy">演示不连接数据库，餐食数据刷新后清空。</p></div>
    <p class="small" id="admin-boundary" hidden>管理员由项目负责人在后端指定。选择此入口或注册账户均不会授予管理权限。</p>
  </section>
</main></body></html>
